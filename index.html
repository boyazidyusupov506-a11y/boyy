DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg,#667, #764);
    }
    .card {
        background: #fff;
        padding: 40ppx 32px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0green, 0blue, 25alpha);
        text-align: center;
        width: 320px;
    }
    h1 {
        margin: 0 0 20px;
        font-size: 22px;
        color: #333;
    }
    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s;
    }
    input:focus {
        border-color: #764ba2;
    }
    button {
        margin-top: 14px;
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        color:#666;
        background: 764ba2;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: backround 0.2s,transform 0.1s;
    }
    button :hover {
        background: #5f3a85;
    }
    button :active {
        transform: scale(0.97);
    }
    #xabar {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 600px;
        min-height: 24px;
        color: #444;
    }
    

    </style>
</head>
<body>
    <input id="taxmin" type="number">
    <button onclick="tekshir()">tekshir</button>
    <p id="xabar"></p>
    <script>
        let maxfiy = Math.floor(Math.random()*20) + 1;
         
        function tekshir(){
            let taxmin = Number(document.getElementById("taxmin").value);
            let xabar = document.getElementById("xabar");
            if (taxmin === maxfiy){
                xabar.textContent = "topding!👌";
            } else if (taxmin < maxfiy) {
                xabar.textContent = "kattaroq son tanla!";
            } else {
                xabar.textContent = "kichikroq son tanla !";
            }
        }
    </script>
</body>
</html>
